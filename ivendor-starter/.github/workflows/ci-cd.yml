name: CI / Build & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish Docker images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ivendor-backend:latest
            ghcr.io/${{ github.repository_owner }}/ivendor-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ivendor-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ivendor-frontend:${{ github.sha }}

      - name: Create release entry (lightweight)
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v-${{ github.sha }}
          release_name: "Build ${{ github.sha }}"
          draft: false
          prerelease: false

  deploy-to-render:
    name: Deploy to Render (optional)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ secrets.RENDER_API_KEY != '' }}
    steps:
      - name: Notify start
        run: echo "Triggering Render deploys for backend and frontend..."

      - name: Trigger backend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          if [ -z "$BACKEND_SERVICE_ID" ]; then echo "No BACKEND_SERVICE_ID provided, skipping."; exit 0; fi
          echo "Triggering deploy for backend ($BACKEND_SERVICE_ID)"
          curl -s -X POST "https://api.render.com/v1/services/${BACKEND_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -d '{}' | jq . || true

      - name: Trigger frontend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          if [ -z "$FRONTEND_SERVICE_ID" ]; then echo "No FRONTEND_SERVICE_ID provided, skipping."; exit 0; fi
          echo "Triggering deploy for frontend ($FRONTEND_SERVICE_ID)"
          curl -s -X POST "https://api.render.com/v1/services/${FRONTEND_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -d '{}' | jq . || true

  lint-and-test:
    name: Lint & (optional) test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Install backend deps
        working-directory: ./backend
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Run backend lint
        working-directory: ./backend
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
