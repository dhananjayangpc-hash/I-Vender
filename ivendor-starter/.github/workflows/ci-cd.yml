name: CI / Build & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish Docker images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ivendor-backend:latest
            ghcr.io/${{ github.repository_owner }}/ivendor-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ivendor-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ivendor-frontend:${{ github.sha }}

      - name: Create release entry (lightweight)
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v-${{ github.sha }}
          release_name: "Build ${{ github.sha }}"
          draft: false
          prerelease: false

  lint-and-test:
    name: Lint & (optional) test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Install backend deps
        working-directory: ./backend
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Run backend lint
        working-directory: ./backend
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
